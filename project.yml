---

:project:
  :use_exceptions: FALSE
  :use_test_preprocessor: :all
  :use_auxiliary_dependencies: TRUE
  :build_root: build
  :release_build: TRUE
  :test_file_prefix: test_
  :which_ceedling: gem
  :default_tasks:
    - test:all

:release_build:
  :output: lw.out

:paths:
  :source:
    - src/**
  :test:
    - +:test/**
    - -:test/support
  :include:
    - include/*
  :support:
    - test/support

:defines:
  # in order to add common defines:
  #  1) remove the trailing [] from the :common: section
  #  2) add entries to the :common: section (e.g. :test: has TEST defined)
  :common: &common_defines []
  :test:
    - *common_defines
    - TEST
  :test_preprocess:
    - *common_defines
    - TEST

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: TRUE
  :includes:
    - libhe_testable_types.h
  :plugins:
    - :ignore
    - :callback
    - :expect_any_args
    - :ignore_arg
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    bool:     UINT8


:plugins:
  :enabled:
    - module_generator
    - dependencies
    - compile_commands_json_db

:dependencies:
  :deps:
    - :name: lightway_core
      :paths:
        :fetch: third_party/lightway_core
        :source: third_party/lightway_core
        :build: third_party/lightway_core
      :fetch:
        :method: :git
        :source: https://github.com/expressvpn/lightway-core.git
        :hash: cd75c2f68db4c242417184d347a293cfa524cec7
      :environment:
      - CFLAGS= -DLARGE_STATIC_BUFFERS -DWOLFSSL_DTLS_ALLOW_FUTURE -DWOLFSSL_MIN_RSA_BITS=2048 -DWOLFSSL_MIN_ECC_BITS=256 -fPIC
      :build:
        - ceedling --mixin=linux_x64 release --verbosity=debug
      :artifacts:
        :includes:
          - public
        :static_libraries:
          - build/artifacts/release/libhelium.a
          - third_party/wolfssl/install/lib/libwolfssl.a
    - :name: libuv
      :paths:
        :fetch: third_party/libuv/source
        :source: third_party/libuv/source
        :build: third_party/libuv/install
        :artifact: third_party/libuv/install
      :fetch:
        :method: :git
        :source: https://github.com/libuv/libuv.git
        :tag: v1.46.0
      :build:
        - "sh autogen.sh"
        - "./configure --prefix=$(pwd)/../install/ --enable-static --disable-shared"
        - "make"
        - "make install"
      :artifacts:
        :includes:
          - include
        :static_libraries:
          - lib/libuv.a
    - :name: zlog
      :paths:
        :fetch: third_party/zlog
        :source: third_party/zlog
        :build: third_party/zlog/tidy
      :fetch:
        :method: :git
        :source: https://github.com/zma/zlog.git
        :hash: 16f266e
      :build:
        - mkdir -p tidy
        - cp zlog.c tidy/
        - cp zlog.h tidy/
        - cp zlog-config.h tidy/
        - sed -i "s/1 << 22/1 << 10/" tidy/zlog-config.h
        - sed -i "s/15/2/" zlog-config.h
      :artifacts:
        :includes:
          - .
        :source:
          - zlog.c
        :static_libraries:
          - libdummy.a
    - :name: argparse
      :paths:
        :fetch: third_party/argparse
        :source: third_party/argparse
        :build: third_party/argparse/tidy
      :fetch:
        :method: :git
        :source: https://github.com/cofyc/argparse.git
        :tag: v1.1.0
      :build:
        - mkdir -p tidy
        - cp argparse.c tidy/
        - cp argparse.h tidy/
      :artifacts:
        :includes:
          - .
        :source:
          - argparse.c
        :static_libraries:
          - libdummy.a

:libraries:
  :system:
    - pthread
    - m
    - dl

:flags:
  :release:
    :compile:
      - -O3
      - -g

...
